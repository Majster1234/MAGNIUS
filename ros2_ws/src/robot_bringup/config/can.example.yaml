# Szablon projektu; brak programu wczytującego. To nie jest plik parametrów ROS 2.
# null = TODO, wartość wymaga ustalenia na podstawie fizycznego sprzętu.
transport: socketcan
interface: can0
bitrate: 500000  # bit/s; prędkość napędów potwierdzona przez użytkownika
adapter:
  manufacturer: BIGTREETECH
  model: U2C
  hardware_version: "2.1"
  firmware_version: null
protocol: mks_servo_can  # Protokół producenta MKS SERVO42D CAN
