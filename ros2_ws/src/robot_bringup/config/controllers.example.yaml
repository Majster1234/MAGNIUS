# Szablon parametrów ROS 2; nie jest gotowy do uruchomienia.
# Profil startowy 50 Hz; wymaga pełnego URDF, konfiguracji osi i odbioru sprzętu.
controller_manager:
  ros__parameters:
    update_rate: 50  # Profil pomiarowy, nie potwierdzenie płynności ruchu.
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    joint_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

joint_trajectory_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3
      - joint_4
      - joint_5
      - joint_6
    command_interfaces:
      - position
    state_interfaces:
      - position
    allow_partial_joints_goal: false
