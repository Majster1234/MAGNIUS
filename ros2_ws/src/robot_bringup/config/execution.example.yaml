# Wspólne parametry procesu posiadającego CAN: diagnostyka albo CanSystem.
# Ten szablon NIE zezwala na wykonanie. Domyślny acc profilu streaming = 240.
# Bez ACK ruchu; tolerancja dotyczy wyłącznie dolotu końcowego.
/**:
  ros__parameters:
    execution_enabled: false
    execution_configuration_revision: ""
    execution_use_ack: false
    execution_lookahead_time_sec: 0.025
    execution_velocity_ff_scale: 1.15
    execution_min_holding_rpm: 3
    execution_max_rpm: 2500
    execution_position_period_ms: 10
    execution_position_tolerance_rad: [0.008726646259971648, 0.008726646259971648, 0.008726646259971648, 0.008726646259971648, 0.008726646259971648, 0.008726646259971648]
    execution_acceleration_codes: [240, 240, 240, 240, 240, 240]
