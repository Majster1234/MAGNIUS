# Szablon projektu; brak programu wczytującego. To nie jest plik parametrów ROS 2.
# null = TODO; nie zastępować arbitralnymi wartościami.
# gear_ratio: liczba obrotów silnika na obrót przegubu, dodatnia.
# direction: 1 lub -1. Pozycja: direction * motor_rad / gear_ratio + zero_offset_rad.
